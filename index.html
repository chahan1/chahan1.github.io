        async function addSubTask(mainTaskId) {
            const task = findMain(mainTaskId);
            if (!task) return;

            let text = "";
            // 離線時語音辨識無法使用，直接改用鍵盤
            if (SpeechRecognition && navigator.onLine && confirm("要使用語音輸入單字嗎？\n(按『取消』改用鍵盤輸入)")) {
                showVoiceStatus("🎤 請說出英文單字...");
                try {
                    text = await listenOnceEnglish();
                    voiceStatus.style.display = 'none';
                    // 讓使用者確認/修改辨識結果
                    text = prompt("辨識結果如下，可修改後按確定：", text);
                } catch(e) {
                    voiceStatus.style.display = 'none';
                    text = prompt("語音失敗，請手動輸入【單字 / 短語】：");
                }
            } else {
                text = prompt("請輸入【單字 / 短語】：");
            }

            if (!text || !text.trim()) return;
            text = text.trim();

            const subId = newId();

            // 離線：先存起來，標記為「待補齊」，上線後自動查詢
            if (!navigator.onLine) {
                task.subtasks.unshift({ id: subId, text: text, definition: PENDING_DEF_TEXT, checked: false, collapsed: false, showDef: false, pendingAI: true, createdAt: Date.now(), grandtasks: [] });
                task.collapsed = false; saveData();
                showToast("📴 目前離線，已先存下單字\n上線後會自動補上釋義與例句");
                return;
            }

            task.subtasks.unshift({ id: subId, text: text, definition: LOADING_TEXT, checked: false, collapsed: false, showDef: false, isLoading: true, createdAt: Date.now(), grandtasks: [] });
            task.collapsed = false; saveData();

            let result = null, failKind = null;
            try { result = await fetchDefinitionAndSentence(text); }
            catch (e) { failKind = e.kind || classifyError(e); }

            // 查詢期間使用者可能拖曳或刪除，因此重新用 ID 找到該單字再寫入
            const sub = findSubAnywhere(subId);
            if (!sub) return;
            sub.isLoading = false;
            if (result) {
                applyAIResult(sub, result);
            } else if (failKind === 'offline' || failKind === 'quota') {
                // 網路中斷或額度暫時用完：排入待補齊，之後自動重試
                sub.pendingAI = true;
                sub.definition = PENDING_DEF_TEXT;
                showToast("⏳ 暫時無法連線 AI，已排入待補齊\n稍後會自動重試");
            } else {
                sub.definition = MANUAL_DEF_TEXT;
            }
            saveData();
        }

        // 把 AI 結果寫進單字（使用者若已手動填寫釋義，就不覆蓋）
        function applyAIResult(sub, result) {
            const placeholders = [LOADING_TEXT, PENDING_DEF_TEXT, MANUAL_DEF_TEXT, ''];
            if (!sub.definition || placeholders.includes(sub.definition)) sub.definition = result.definition;
            sub.showDef = true;
            if (result.sentence) sub.grandtasks.unshift({ id: newId(), text: result.sentence, checked: false, createdAt: Date.now() });
            delete sub.pendingAI;
        }

        // --- 上線後自動補齊離線時新增的單字 ---
        let isFillingPending = false;
        function countPending() { let n = 0; tasks.forEach(t => t.subtasks.forEach(s => { if (s.pendingAI) n++; })); return n; }

        async function processPendingAI({ manual = false } = {}) {
            if (isFillingPending) return;
            if (!navigator.onLine) { if (manual) showToast("📴 目前離線，連上網路後會自動補齊"); return; }
            const total = countPending();
            if (total === 0) { if (manual) showToast("沒有需要補齊的單字 👍"); return; }
            if (!localStorage.getItem(API_KEY_STORAGE)) {
                if (manual) setGeminiApiKey(); else showToast(`有 ${total} 個單字待補齊\n請先在選單設定 Gemini 金鑰`, 4000);
                if (!localStorage.getItem(API_KEY_STORAGE)) return;
            }
            isFillingPending = true;
            showToast(`🤖 已連上網路，正在補齊 ${total} 個單字...`, 3000);
            let done = 0, stopReason = null;
            try {
                while (true) {
                    let target = null;
                    for (const t of tasks) { target = t.subtasks.find(s => s.pendingAI && !s.isLoading); if (target) break; }
                    if (!target) break;
                    const id = target.id;
                    target.isLoading = true; target.definition = target.definition === PENDING_DEF_TEXT ? LOADING_TEXT : target.definition;
                    saveData();
                    try {
                        const result = await fetchDefinitionAndSentence(target.text, { silent: true });
                        const sub = findSubAnywhere(id);
                        if (sub) { sub.isLoading = false; applyAIResult(sub, result); saveData(); }
                        done++;
                    } catch (e) {
                        const sub = findSubAnywhere(id);
                        const kind = classifyError(e);
                        if (sub) {
                            sub.isLoading = false;
                            if (kind === 'other') { delete sub.pendingAI; if (sub.definition === LOADING_TEXT) sub.definition = MANUAL_DEF_TEXT; }
                            else if (sub.definition === LOADING_TEXT) sub.definition = PENDING_DEF_TEXT;
                            saveData();
                        }
                        if (kind !== 'other') { stopReason = kind; break; }   // 沒網路/金鑰錯/額度滿：先停，之後再試
                    }
                    await new Promise(r => setTimeout(r, 800));                // 間隔一下，避免太快被限制
                }
            } finally { isFillingPending = false; }

            const left = countPending();
            if (stopReason === 'key') showToast(`⚠️ Gemini 金鑰有問題，還有 ${left} 個單字待補齊\n請到選單檢查金鑰`, 4500);
            else if (stopReason === 'quota') showToast(`⚠️ AI 額度暫時用完，已補齊 ${done} 個\n剩下 ${left} 個稍後自動重試`, 4500);
            else if (stopReason === 'offline') showToast(`📴 網路又斷了，已補齊 ${done} 個，剩下 ${left} 個`, 4000);
            else if (done > 0) showToast(`✅ 已自動補齊 ${done} 個單字的釋義與例句`, 3500);
        }

        window.addEventListener('online', () => setTimeout(() => processPendingAI(), 1500));
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') processPendingAI(); });
        setInterval(() => { if (countPending() > 0) processPendingAI(); }, 5 * 60 * 1000); // 每 5 分鐘再試一次

        function addGrandTask(mainTaskId, subTaskId) {
            const text = prompt("請輸入【例句 / 用法】："); if (!text || !text.trim()) return;
            const sub = findSub(mainTaskId, subTaskId);
            if (sub) {
                sub.grandtasks.unshift({ id: newId(), text: text.trim(), checked: false, createdAt: Date.now() });
                saveData();
                if (isHideEx) showToast('已新增例句（目前例句為隱藏狀態，可在選單開啟）', 2500);
            }
        }

        function getTarget(id, level, parentId, grandParentId) {
            if (level === 'main') return findMain(id);
            if (level === 'sub') return findSub(parentId, id);
            if (level === 'grand') { const p = findSub(grandParentId, parentId); return p ? p.grandtasks.find(g => g.id === id) : null; }
            return null;
        }

        function editTask(id, level, parentId = null, grandParentId = null) {
            const target = getTarget(id, level, parentId, grandParentId);
            if (target) { const nt = prompt("請修改內容：", target.text); if (nt && nt.trim()) { target.text = nt.trim(); saveData(); } }
        }

        function toggleCheck(id, level, parentId = null, grandParentId = null) {
            const target = getTarget(id, level, parentId, grandParentId);
            if (target) { target.checked = !target.checked; target.completedAt = target.checked ? Date.now() : null; saveData(); }
        }

        function deleteTask(id, level, parentId = null, grandParentId = null) {
            if (!confirm('確定刪除？')) return;
            if (level === 'main') tasks = tasks.filter(t => t.id !== id);
            else if (level === 'sub') { const p = findMain(parentId); if (p) p.subtasks = p.subtasks.filter(s => s.id !== id); }
            else if (level === 'grand') { const p = findSub(grandParentId, parentId); if (p) p.grandtasks = p.grandtasks.filter(g => g.id !== id); }
            saveData();
        }

        // --- 8. 畫面繪製 ---
        function getTimeBadgeHtml(obj) {
            const createStr = formatTime(obj.createdAt), completeStr = formatTime(obj.completedAt);
            return `<span class="time-badge">建立: ${createStr}${completeStr ? ` | 熟記: ${completeStr}` : ''}</span>`;
        }

        // 把中文部分包進 <span class="cn-text">，讓「隱藏中文」可以運作
        function formatTextWithCn(rawText) {
            const safe = escapeHtml(rawText);
            if (!/[一-鿿]/.test(safe)) return safe;
            return safe.replace(/(\([^()]*[一-鿿][^()]*\)|（[^（）]*）|[一-鿿][^\n]*)/g, '<span class="cn-text">$1</span>');
        }

        function renderTasks() {
            sortableInstances.forEach(instance => { try { instance.destroy(); } catch (e) {} });
            sortableInstances = [];
            const container = document.getElementById('taskList'); container.innerHTML = '';

            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty-hint">還沒有筆記，先在上方新增一個主題吧！</div>';
            }

            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'task-card' + (task.checked ? ' completed-card' : '');
                card.dataset.id = task.id;
                
                const toggleBtnHtml = task.subtasks.length > 0 ? `<div class="toggle-icon" onclick="toggleSubtasks(${task.id}, 'main')">${task.collapsed ? '▶' : '▼'}</div>` : `<div class="toggle-placeholder"></div>`;
                let html = `
                    <div class="task-row main-row">
                        <div class="drag-handle main-handle">☰</div>
                        ${toggleBtnHtml}
                        <input type="checkbox" ${task.checked ? 'checked' : ''} onchange="toggleCheck(${task.id}, 'main')">
                        <div class="task-text main-task-text ${task.checked ? 'completed' : ''}" onclick="editTask(${task.id}, 'main')">
                            ${formatTextWithCn(task.text)} ${getTimeBadgeHtml(task)}
                        </div>
                        <div class="row-actions">
                            <button class="action-btn btn-edit" onclick="editTask(${task.id}, 'main')">${ICON.edit}</button>
                            <button class="action-btn btn-delete" onclick="deleteTask(${task.id}, 'main')">${ICON.trash}</button>
                            <button class="action-btn btn-add-sub" title="新增單字" onclick="addSubTask(${task.id})">${ICON.plus}</button>
                        </div>
                    </div>
                    <div class="subtask-container ${task.collapsed ? 'collapsed' : ''}">
                `;
                
                task.subtasks.forEach(sub => {
                    const loadingTag = sub.isLoading ? `<span class="ai-loading">🤖 查詢中...</span>`
                                     : sub.pendingAI ? `<span class="pending-tag" title="上線後自動補齊">待補齊</span>` : '';
                    html += `
                        <div class="subtask-item ${sub.checked ? 'completed-sub' : ''}" data-id="${sub.id}">
                        <div class="task-row subtask-row">
                            <div class="drag-handle sub-handle">☰</div>
                            <input type="checkbox" ${sub.checked ? 'checked' : ''} onchange="toggleCheck(${sub.id}, 'sub', ${task.id})">
                            <div class="task-text sub-task-text ${sub.checked ? 'completed' : ''}" onclick="editTask(${sub.id}, 'sub', ${task.id})">
                                ${formatTextWithCn(sub.text)} ${loadingTag} ${getTimeBadgeHtml(sub)}
                            </div>
                            <div class="row-actions">
                                <button class="icon-btn speak" title="朗讀" data-speak="${escapeAttr(sub.text)}" onclick="speakText(this.dataset.speak)">${ICON.speak}</button>
                                <button class="action-btn btn-edit" onclick="editTask(${sub.id}, 'sub', ${task.id})">${ICON.edit}</button>
                                <button class="action-btn btn-delete" onclick="deleteTask(${sub.id}, 'sub', ${task.id})">${ICON.trash}</button>
                                <button class="action-btn btn-add-sub small" title="新增例句" onclick="addGrandTask(${task.id}, ${sub.id})">${ICON.plus}</button>
                            </div>
                        </div>
                    `;
                    if (sub.definition) html += `<div class="definition-box" title="點一下可修改釋義" onclick="editDefinition(${sub.id}, ${task.id})"><div class="def-content">${escapeHtml(sub.definition)}</div></div>`;
                    
                    html += `<div class="grandtask-container">`;
                    sub.grandtasks.forEach(grand => {
                        html += `
                            <div class="task-row grandtask-row ${grand.checked ? 'completed-grand' : ''}" data-id="${grand.id}">
                                <div class="drag-handle grand-handle">☰</div>
                                <input type="checkbox" ${grand.checked ? 'checked' : ''} onchange="toggleCheck(${grand.id}, 'grand', ${sub.id}, ${task.id})">
                                <div class="task-text grand-task-text ${grand.checked ? 'completed' : ''}" onclick="editTask(${grand.id}, 'grand', ${sub.id}, ${task.id})">
                                    ${formatTextWithCn(grand.text)} ${getTimeBadgeHtml(grand)}
                                </div>
                                <div class="row-actions">
                                    <button class="icon-btn speak" title="朗讀" data-speak="${escapeAttr(grand.text)}" onclick="speakText(this.dataset.speak)">${ICON.speak}</button>
                                    <button class="action-btn btn-edit" onclick="editTask(${grand.id}, 'grand', ${sub.id}, ${task.id})">${ICON.edit}</button>
                                    <button class="action-btn btn-delete" onclick="deleteTask(${grand.id}, 'grand', ${sub.id}, ${task.id})">${ICON.trash}</button>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div></div>`; // 關閉 grandtask-container 與 subtask-item
                });
                
                html += `</div>`; card.innerHTML = html; container.appendChild(card);
            });
            initSortable();
            if (player.open) highlightPlaying(false);
        }

        function initSortable() {
            if (typeof Sortable === 'undefined') return;
            try {
                const mainList = document.getElementById('taskList');
                sortableInstances.push(new Sortable(mainList, { animation: 150, handle: '.main-handle', draggable: '.task-card', onEnd: syncDataFromDOM }));
                document.querySelectorAll('.subtask-container').forEach(c => sortableInstances.push(new Sortable(c, {
                    group: 'shared-subtasks', animation: 150, handle: '.sub-handle', draggable: '.subtask-item',
                    fallbackOnBody: true, swapThreshold: 0.65, onEnd: syncDataFromDOM
                })));
                document.querySelectorAll('.grandtask-container').forEach(c => sortableInstances.push(new Sortable(c, {
                    group: 'shared-grandtasks', animation: 150, handle: '.grand-handle', draggable: '.grandtask-row',
                    fallbackOnBody: true, swapThreshold: 0.65, onEnd: syncDataFromDOM
                })));
            } catch (e) { console.error("拖曳功能初始化失敗:", e); }
        }

        initViewToggles(); initHideExCnBtn(); initTimeBtn(); initToggleBtn(); renderTasks(); checkBackupReminder();
        setTimeout(() => processPendingAI(), 2000);   // 開啟 App 時若有網路，自動補齊

        // --- 9. 註冊 Service Worker（PWA 離線開啟） ---
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service Worker 註冊失敗:', err));
            });
        }
    </script>
</body>
</html>
