name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: android
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../eng-notebook.apk
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 英語筆記本 Android App
          body: |
            第 ${{ github.run_number }} 版。用手機開啟下面的 eng-notebook.apk 下載並安裝。
            直接下載：https://github.com/chahan1/chahan1.github.io/releases/download/android-latest/eng-notebook.apk
          files: eng-notebook.apk
          make_latest: true
      - name: Clear old build log
        run: git push origin --delete android-build-log || true
      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git checkout --orphan android-build-log
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin android-build-log
